name: Audit NGSL story-body coverage

on:
  push:
    paths:
      - 'scripts/audit_story_coverage.py'
      - 'chapter-*.js'
      - 'dictionary-ngsl.js'
      - 'dictionary-supplement.js'
      - '.github/workflows/audit-story-coverage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit actual story text
        run: python scripts/audit_story_coverage.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STORY_COVERAGE_AUDIT.md
          if git diff --cached --quiet; then
            echo "No audit report changes"
          else
            git commit -m "Report actual NGSL story-body coverage"
            git push
          fi

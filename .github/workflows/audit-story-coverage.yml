name: Audit complete story coverage

on:
  push:
    paths:
      - 'scripts/audit_story_coverage.py'
      - 'chapter-*.js'
      - 'poly-*.js'
      - 'collocations-*.js'
      - 'dictionary-ngsl.js'
      - 'dictionary-supplement.js'
      - 'PHAVE_COVERAGE.md'
      - 'STORY_SENTENCES_FINAL.json'
      - '.github/workflows/audit-story-coverage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit all required story coverage
        id: audit
        continue-on-error: true
        run: python scripts/audit_story_coverage.py
      - name: Commit audit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STORY_COVERAGE_AUDIT.md
          if git diff --cached --quiet; then
            echo "No audit report changes"
          else
            git commit -m "Audit all required story coverage"
            git push
          fi
      - name: Fail if any required coverage is missing
        if: steps.audit.outcome == 'failure'
        run: exit 1

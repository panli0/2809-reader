name: Keep only main and compact reader branch

on:
  push:
    branches:
      - compact-reader-2026-11-03
    paths:
      - .github/workflows/cleanup-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const keep = new Set(["main", "compact-reader-2026-11-03"]);
            const remove = [
              "backup/pre-polysemy-realignment-2026-11-02",
              "backup/pre-repair-2026-11-01",
              "repair/coverage-and-readability-2026-11-02",
              "repair/reader-quality-2026-11-01"
            ];
            for (const name of remove) {
              if (keep.has(name)) throw new Error("Refusing to delete a protected branch: " + name);
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: "heads/" + name
                });
                core.info("Deleted obsolete branch: " + name);
              } catch (error) {
                if (error.status !== 404) throw error;
                core.info("Already absent: " + name);
              }
            }

name: Delete obsolete reader branch once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/delete-old-branch-once.yml'

permissions:
  contents: write

jobs:
  delete-old-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh api "repos/$REPO/git/ref/heads/compact-reader-2026-11-03" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$REPO/git/refs/heads/compact-reader-2026-11-03"
            echo "Deleted compact-reader-2026-11-03"
          else
            echo "compact-reader-2026-11-03 is already absent"
          fi

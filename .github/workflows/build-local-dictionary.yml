name: Build local NGSL dictionary

on:
  push:
    paths:
      - '.github/workflows/build-local-dictionary.yml'
      - 'scripts/build_local_dictionary.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build local dictionary
        run: python scripts/build_local_dictionary.py
      - name: Commit generated dictionary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dictionary-ngsl.js DICTIONARY_COVERAGE.md
          if git diff --cached --quiet; then
            echo "No dictionary changes"
          else
            git commit -m "Build bundled NGSL Chinese dictionary"
            git push
          fi
